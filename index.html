<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yannawut AI</title><style>:root{--bg:#0b0912;--p:#171320;--p2:#211833;--t:#f7f3ff;--m:#a9a2b8;--a:#8b5cf6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#2a164c,#0b0912 42%);color:var(--t);font-family:system-ui,sans-serif}button,input{font:inherit}.app{max-width:520px;margin:auto;min-height:100vh}.head{padding:22px 18px}.brand{display:flex;justify-content:space-between;align-items:center}.brand h1{margin:0;font-size:22px}.muted{color:var(--m)}.badge{padding:6px 10px;border-radius:99px;background:#211536;color:#cbb7ff;font-size:12px}.main{padding:8px 16px}.hero{padding:16px 4px 20px}.hero h2{font-size:28px;margin:0 0 8px}.hero p{margin:0;color:var(--m)}.grid{display:grid;gap:13px}.card{background:linear-gradient(145deg,#1c1728,#110e18);border:1px solid #2c2438;border-radius:20px;padding:17px;text-align:left;color:white;cursor:pointer}.avatar{width:52px;height:52px;border-radius:16px;background:#291b42;display:grid;place-items:center;font-size:27px;margin-bottom:12px}.card h3{margin:0 0 5px}.card p{margin:0;color:var(--m);font-size:14px;line-height:1.5}.chat{display:none;min-height:100vh;flex-direction:column}.chat.on{display:flex}.home.off{display:none}.bar{display:flex;align-items:center;gap:11px;padding:12px 14px;border-bottom:1px solid #2b2335;background:#0b0912e8;position:sticky;top:0}.back{width:40px;height:40px;border:0;border-radius:13px;background:#1a1523;color:white;font-size:25px}.bar .avatar{width:40px;height:40px;margin:0;font-size:21px}.title{flex:1}.online{color:#7fe0a7;font-size:12px}.msgs{flex:1;padding:20px 15px 95px;display:flex;flex-direction:column;gap:10px}.bubble{max-width:82%;padding:11px 14px;border-radius:17px;line-height:1.55;white-space:pre-wrap}.bot{align-self:flex-start;background:#191522;border:1px solid #2b2435;border-bottom-left-radius:5px}.user{align-self:flex-end;background:linear-gradient(135deg,#7043d7,#9569ff);border-bottom-right-radius:5px}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);padding:10px 12px 14px;background:linear-gradient(transparent,#0b0912 30%)}form{display:flex;gap:8px;background:#17131f;border:1px solid #302741;border-radius:18px;padding:7px}input{flex:1;background:transparent;border:0;outline:0;color:white;padding:10px}.send{width:42px;border:0;border-radius:14px;background:var(--a);color:white}.note{text-align:center;color:#6f687c;font-size:11px;margin-top:7px}</style></head><body><div class="app"><section id="home" class="home"><header class="head"><div class="brand"><div><h1>YANNAWUT AI</h1><span class="muted">AI Chat • Telegram Mini App</span></div><span class="badge">BETA</span></div></header><main class="main"><div class="hero"><h2>คุยกับ AI ของคุณ</h2><p>เลือกตัวละครที่อยากคุย แล้วเริ่มบทสนทนาได้เลย</p></div><div class="grid"><button class="card" data-ai="Luna"><div class="avatar">🌙</div><h3>Luna</h3><p>เพื่อนคุยเป็นกันเอง คุยได้ทุกเรื่องและรับฟังคุณ</p></button><button class="card" data-ai="Alex"><div class="avatar">🧠</div><h3>Alex</h3><p>ผู้ช่วยส่วนตัว ช่วยคิด วางแผน และจัดระเบียบงาน</p></button><button class="card" data-ai="Maya"><div class="avatar">📚</div><h3>Maya</h3><p>ผู้ช่วยเรียน อธิบายเรื่องยากให้เข้าใจง่าย</p></button></div></main></section><section id="chat" class="chat"><div class="bar"><button class="back" id="back">‹</button><div id="ava" class="avatar">🌙</div><div class="title"><b id="name">Luna</b><div class="online">● ออนไลน์</div></div></div><div id="msgs" class="msgs"></div><div class="composer"><form id="form"><input id="input" placeholder="พิมพ์ข้อความ..." autocomplete="off"><button class="send">➤</button></form><div class="note">เวอร์ชันทดลอง • ยังไม่ได้เชื่อม AI API</div></div></section></div><script>const D={Luna:['🌙','สวัสดีค่ะ 😊 ฉัน Luna ยินดีที่ได้คุยกับคุณ วันนี้อยากคุยเรื่องอะไรดีคะ?'],Alex:['🧠','สวัสดีครับ ผม Alex 👋 ถ้ามีเรื่องให้ช่วยคิด วางแผน หรือจัดการงาน บอกผมได้เลยครับ'],Maya:['📚','สวัสดีค่ะ 📚 ฉัน Maya พร้อมช่วยอธิบายบทเรียนหรือเรื่องที่คุณกำลังสงสัยให้เข้าใจง่ายขึ้นค่ะ']};const home=document.querySelector('#home'),chat=document.querySelector('#chat'),msgs=document.querySelector('#msgs');function add(t,c){let d=document.createElement('div');d.className='bubble '+c;d.textContent=t;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight}function openChat(n){document.querySelector('#name').textContent=n;document.querySelector('#ava').textContent=D[n][0];msgs.innerHTML='';add(D[n][1],'bot');home.classList.add('off');chat.classList.add('on');document.querySelector('#input').focus()}document.querySelectorAll('.card').forEach(x=>x.onclick=()=>openChat(x.dataset.ai));document.querySelector('#back').onclick=()=>{chat.classList.remove('on');home.classList.remove('off')};document.querySelector('#form').onsubmit=e=>{e.preventDefault();let i=document.querySelector('#input'),v=i.value.trim();if(!v)return;add(v,'user');i.value='';setTimeout(()=>add('ตอนนี้เป็นหน้าเว็บตัวอย่างครับ 😊 ขั้นต่อไปเราจะเชื่อม AI จริงให้ตอบข้อความของคุณได้','bot'),450)};</script></body></html>
